<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフボード</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 16px 20px;
            text-align: center;
        }

        header h1 { font-size: 22px; font-weight: 600; }
        header p { font-size: 12px; opacity: 0.7; margin-top: 4px; }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .member-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .member-card:active { transform: scale(0.96); }

        .member-name { font-size: 18px; font-weight: 600; color: #2c3e50; margin-bottom: 8px; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-在社    .status-badge { background: #d4edda; color: #155724; }
        .status-外出中  .status-badge { background: #fff3cd; color: #856404; }
        .status-休憩中  .status-badge { background: #cce5ff; color: #004085; }
        .status-休み    .status-badge { background: #f8d7da; color: #721c24; }

        .status-在社   { border-color: #28a745; }
        .status-外出中 { border-color: #ffc107; }
        .status-休憩中 { border-color: #17a2b8; }
        .status-休み   { border-color: #dc3545; }

        .updated-time { font-size: 10px; color: #aaa; margin-top: 6px; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 290px;
            text-align: center;
        }

        .modal h2 { font-size: 17px; margin-bottom: 16px; color: #2c3e50; }

        .status-buttons { display: flex; flex-direction: column; gap: 10px; }

        .status-btn {
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-在社   { background: #d4edda; color: #155724; }
        .btn-外出中 { background: #fff3cd; color: #856404; }
        .btn-休憩中 { background: #cce5ff; color: #004085; }
        .btn-休み   { background: #f8d7da; color: #721c24; }

        .cancel-btn {
            margin-top: 12px;
            padding: 10px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }

        .loading { text-align: center; padding: 40px; color: #aaa; }
    </style>
</head>
<body>

<header>
    <h1>📋 スタッフボード</h1>
    <p id="last-update">読み込み中...</p>
</header>

<div class="container">
    <div class="grid" id="members-grid">
        <div class="loading">読み込み中...</div>
    </div>
</div>

<!-- 状態変更モーダル -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modal-name"></h2>
        <div class="status-buttons">
            <button class="status-btn btn-在社"   onclick="updateStatus('在社')">🏢 在社</button>
            <button class="status-btn btn-外出中" onclick="updateStatus('外出中')">🚗 外出中</button>
            <button class="status-btn btn-休憩中" onclick="updateStatus('休憩中')">☕ 休憩中</button>
            <button class="status-btn btn-休み"   onclick="updateStatus('休み')">🏠 休み</button>
        </div>
        <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    const SUPABASE_URL = 'https://wkramctyxgdjpqueuyfp.supabase.co';
    const SUPABASE_KEY = 'REDACTED_SUPABASE_KEY'; // ここにAPIキーを貼り付け

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedMemberId = null;
    let members = [];

    async function loadMembers() {
        const { data, error } = await client
            .from('members')
            .select('*')
            .order('id');

        if (error) { console.error(error); return; }

        members = data;
        renderMembers();

        const now = new Date();
        document.getElementById('last-update').textContent =
            `最終更新: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    function renderMembers() {
        const grid = document.getElementById('members-grid');
        grid.innerHTML = members.map(m => `
            <div class="member-card status-${m.status}" onclick="openModal(${m.id}, '${m.name}')">
                <div class="member-name">${m.name}</div>
                <span class="status-badge">${emoji(m.status)} ${m.status}</span>
                <div class="updated-time">${formatTime(m.updated_at)}</div>
            </div>
        `).join('');
    }

    function emoji(status) {
        return { '在社':'🏢', '外出中':'🚗', '休憩中':'☕', '休み':'🏠' }[status] || '';
    }

    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')} 更新`;
    }

    function openModal(id, name) {
        selectedMemberId = id;
        document.getElementById('modal-name').textContent = `${name} の状態を変更`;
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
        selectedMemberId = null;
    }

    async function updateStatus(status) {
        if (!selectedMemberId) return;
        const { error } = await client
            .from('members')
            .update({ status, updated_at: new Date().toISOString() })
            .eq('id', selectedMemberId);

        if (error) { alert('更新に失敗しました'); return; }
        closeModal();
        await loadMembers();
    }

    // リアルタイム更新
    client.channel('members-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, loadMembers)
        .subscribe();

    // モーダル外クリックで閉じる
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    loadMembers();
    setInterval(loadMembers, 30000); // 30秒ごとに自動更新
</script>
</body>
</html>
